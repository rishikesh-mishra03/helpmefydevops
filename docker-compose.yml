version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpmefy_web_container
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
